HTML

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layan | ليان للعقارات</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      color: #172b4d;
    }
    header {
      background: #103b68;
      color: white;
      padding: 24px 18px;
      border-radius: 0 0 24px 24px;
    }
    header h1 { margin: 0 0 8px; font-size: 28px; }
    header p { margin: 0; color: #dce9f7; }
    main { padding: 18px; max-width: 650px; margin: auto; }
    .search, .filters, .card {
      background: white;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #e3eaf2;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd6e2;
      border-radius: 9px;
      margin-top: 8px;
      font-size: 15px;
      background: white;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .primary { background: #d8a744; color: #172b4d; }
    .secondary { background: #e8f1fb; color: #103b68; }
    .card { padding: 0; overflow: hidden; }
    .photo {
      height: 175px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #dce8f4, #a9c5df);
      color: #103b68;
      font-size: 52px;
    }
    .details { padding: 16px; }
    .details h3 { margin: 0 0 8px; font-size: 19px; }
    .location { color: #64748b; font-size: 14px; }
    .price { color: #103b68; font-size: 21px; font-weight: bold; margin: 12px 0; }
    .info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 14px 0;
    }
    .info div { background: #f3f6fa; padding: 10px; border-radius: 9px; font-size: 13px; }
    .info strong { display: block; margin-top: 5px; font-size: 15px; }
    .actions { display: flex; gap: 8px; }
    .actions button { flex: 1; }
    .add {
      width: 100%;
      margin: 5px 0 20px;
      background: #147d64;
      color: white;
    }
    footer { text-align: center; color: #64748b; padding: 20px; font-size: 13px; }
    .note { font-size: 12px; color: #64748b; margin-top: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>ليان Layan 🏡</h1>
    <p>فرصتك الجديدة للاستثمار العقاري</p>
    <p style="margin-top:12px">📍 محافظة أسيوط</p>
  </header>

  <main>
    <div class="search">
      <label for="search">ابحث عن وحدتك العقارية</label>
      <input id="search" placeholder="المنطقة أو نوع الوحدة..." oninput="filterOffers()">
    </div>

    <div class="filters">
      <label for="type">نوع الوحدة</label>
      <select id="type" onchange="filterOffers()">
        <option value="">كل الوحدات</option>
        <option value="شقة">شقة</option>
        <option value="فيلا">فيلا</option>
        <option value="محل">محل تجاري</option>
      </select>
    </div>

    <h2>🏘️ قائمة العروض</h2>
    <div id="offers"></div>

    <button class="add" onclick="addOffer()">＋ إضافة عرض جديد</button>
    <p class="note">الأسعار والبيانات المعروضة تجريبية للتوضيح وليست عروضًا حقيقية.</p>
  </main>

  <footer>ليان للعقارات © 2026</footer>

  <script>
    const offers = [
      {
        type: "شقة",
        title: "شقة سكنية للبيع بالتنازل",
        area: "أسيوط الجديدة",
        price: 1200000,
        paid: 300000,
        remaining: 900000,
        fees: "تُحدد مع الشركة",
        discount: "حسب الاتفاق"
      },
      {
        type: "شقة",
        title: "شقة مميزة بالتقسيط",
        area: "مدينة أسيوط",
        price: 950000,
        paid: 250000,
        remaining: 700000,
        fees: "غير محددة",
        discount: "غير محدد"
      },
      {
        type: "فيلا",
        title: "فيلا عائلية",
        area: "أسيوط الجديدة",
        price: 2400000,
        paid: 600000,
        remaining: 1800000,
        fees: "تُراجع مع المطور",
        discount: "حسب الاتفاق"
      }
    ];

    function money(n) {
      return n.toLocaleString("en-US") + " جنيه";
    }

    function render(list) {
      const container = document.getElementById("offers");
      if (!list.length) {
        container.innerHTML = "<p>لا توجد عروض مطابقة للبحث.</p>";
        return;
      }

      container.innerHTML = list.map((o) => `
        <article class="card">
          <div class="photo">🏠</div>
          <div class="details">
            <h3>${o.title}</h3>
            <div class="location">📍 ${o.area} · ${o.type}</div>
            <div class="price">${money(o.price)}</div>
            <div class="info">
              <div>المقدم المدفوع<strong>${money(o.paid)}</strong></div>
              <div>الأقساط المتبقية<strong>${money(o.remaining)}</strong></div>
              <div>رسوم التنازل<strong>${o.fees}</strong></div>
              <div>الخصم المحتمل<strong>${o.discount}</strong></div>
            </div>
            <div class="actions">
              <button class="secondary" onclick="details('${o.title}')">عرض التفاصيل</button>
              <button class="primary" onclick="contact()">استفسر الآن</button>
            </div>
          </div>
        </article>
      `).join("");
    }

    function filterOffers() {
      const q = document.getElementById("search").value.trim();
      const type = document.getElementById("type").value;
      render(offers.filter(o =>
        (o.title + o.area + o.type).includes(q) &&
        (!type || o.type === type)
      ));
    }

    function details(title) {
      const o = offers.find(item => item.title === title);
      if (!o) return;
      alert(
        o.title + "\nالمنطقة: " + o.area +
        "\nالسعر: " + money(o.price) +
        "\nالمقدم: " + money(o.paid) +
        "\nالمتبقي: " + money(o.remaining) +
        "\nرسوم التنازل: " + o.fees +
        "\nالخصم: " + o.discount
      );
    }

    function contact() {
      alert("ميزة التواصل ستُضاف في الخطوات القادمة.");
    }

    function addOffer() {
      const title = prompt("اكتب عنوان العرض:");
      if (!title) return;
      const area = prompt("اكتب المنطقة داخل أسيوط:");
      if (!area) return;
      const price = Number(prompt("اكتب السعر الإجمالي بالجنيه:"));
      if (!Number.isFinite(price) || price <= 0) {
        alert("من فضلك أدخل سعرًا صحيحًا.");
        return;
      }
      const paid = Number(prompt("اكتب المقدم المدفوع بالجنيه:"));
      if (!Number.isFinite(paid) || paid < 0 || paid > price) {
        alert("تحقق من قيمة المقدم.");
        return;
      }
      const type = prompt("نوع الوحدة: شقة أو فيلا أو محل") || "شقة";
      const remaining = price - paid;
      offers.unshift({
        type, title, area, price, paid, remaining,
        fees: "تُحدد مع الشركة",
        discount: "حسب الاتفاق"
      });
      filterOffers();
      alert("تمت إضافة العرض لهذه الجلسة.");
    }

    render(offers);
  </script>
</body>
</html>
