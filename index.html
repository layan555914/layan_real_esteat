
<script>
const SUPABASE_URL = 'https://ebyhwqkmhxbgocngpqfe.supabase.co';
const SUPABASE_KEY = 'sb_publishable_8PlFI202E-pIZRAG61L2sA_aSoJ3Qwt';
const BUCKET = 'layan_real_estat';

const $ = id => document.getElementById(id);
let offers = [];

const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({
  '&':'&amp;', '<':'&lt;', '>':'&gt;',
  '"':'&quot;', "'":'&#39;'
}[c]));

const money = v =>
  v === null || v === undefined || v === ''
    ? 'غير محدد'
    : Number(v).toLocaleString('ar-EG') + ' جنيه';

function normalize(o) {
  return {
    id:o.id,
    title:o.title || 'وحدة عقارية',
    type:o.property_type || 'شقة',
    area:o.city || o.area || '',
    unitArea:o.area_m2 || '',
    paid:o.paid_amount ?? 0,
    remaining:o.remaining_amount ?? 0,
    asking:o.total_price ?? null,
    fee:o.assignment_fee ?? '',
    discount:o.discount_amount ?? '',
    company:o.developer_name || '',
    phone:o.contact_phone || '',
    name:o.contact_name || '',
    notes:o.description || '',
    photos:o.image_urls || []
  };
}

function renderOffers() {
  const q = $('search').value.trim().toLowerCase();
  const t = $('typeFilter').value;
  const a = $('areaFilter').value.trim().toLowerCase();

  const list = offers.filter(o =>
    (!q || [o.title,o.area,o.company,o.notes]
      .join(' ').toLowerCase().includes(q)) &&
    (!t || o.type === t) &&
    (!a || o.area.toLowerCase().includes(a))
  );

  $('offerList').innerHTML = list.length
    ? list.map(o => `
      <article class="offer">
        <div class="offer-img">
          ${o.photos.length
            ? `<img src="${esc(o.photos[0])}" alt="صورة الوحدة">`
            : '⌂'}
        </div>
        <div class="offer-body">
          <h3>${esc(o.title)}</h3>
          <div class="meta">
            <span class="tag">${esc(o.type)}</span>
            <span class="tag">${esc(o.area || 'أسيوط')}</span>
            ${o.unitArea
              ? `<span class="tag">${esc(o.unitArea)} م²</span>`
              : ''}
          </div>
          <div class="price">
            مبلغ التنازل: ${money(o.asking)}
          </div>
          <div class="details">
            <p>المبلغ المدفوع: ${money(o.paid)}</p>
            <p>المتبقي: ${money(o.remaining)}</p>
            <p>رسوم التنازل: ${money(o.fee)}</p>
            <p>الخصم: ${money(o.discount)}</p>
            ${o.company
              ? `<p>الشركة: ${esc(o.company)}</p>`
              : ''}
            ${o.notes ? `<p>${esc(o.notes)}</p>` : ''}
          </div>
          ${o.phone
            ? `<a class="contact" href="tel:${esc(o.phone)}">اتصل بصاحب العرض</a>`
            : ''}
        </div>
      </article>
    `).join('')
    : '<div class="empty">لا توجد عروض مطابقة حاليًا. يمكنك إضافة عرض جديد من النموذج بالأسفل.</div>';
}

async function loadOffers() {
  try {
    const r = await fetch(
      `${SUPABASE_URL}/rest/v1/property_offers?select=*&status=eq.available&order=created_at.desc`,
      {
        headers:{
          apikey:SUPABASE_KEY,
          Authorization:`Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!r.ok) throw new Error(await r.text());

    offers = (await r.json()).map(normalize);
    renderOffers();
  } catch (e) {
    $('offerList').innerHTML =
      '<div class="empty">تعذر تحميل العروض. راجع إعدادات قاعدة البيانات.</div>';
    console.error(e);
  }
}

['search','typeFilter','areaFilter'].forEach(id =>
  $(id).addEventListener('input', renderOffers)
);

$('photos').addEventListener('change', () => {
  const files = Array.from($('photos').files);
  $('preview').innerHTML = '';

  if (files.length > 5) {
    alert('اختر 5 صور كحد أقصى.');
    $('photos').value = '';
    return;
  }

  for (const f of files) {
    if (f.size > 5 * 1024 * 1024) {
      alert('حجم كل صورة يجب ألا يتجاوز 5 ميجابايت.');
      $('photos').value = '';
      $('preview').innerHTML = '';
      return;
    }

    const img = document.createElement('img');
    img.src = URL.createObjectURL(f);
    $('preview').appendChild(img);
  }
});

async function uploadPhoto(file) {
  const safe = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
  const path = `offers/${Date.now()}_${Math.random().toString(36).slice(2)}_${safe}`;

  const r = await fetch(
    `${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`,
    {
      method:'POST',
      headers:{
        apikey:SUPABASE_KEY,
        Authorization:`Bearer ${SUPABASE_KEY}`,
        'Content-Type':file.type,
        'x-upsert':'false'
      },
      body:file
    }
  );

  if (!r.ok) throw new Error('تعذر رفع الصور: ' + await r.text());

  return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}`;
}

$('newOffer').addEventListener('submit', async e => {
  e.preventDefault();

  const btn = $('submitBtn');
  const status = $('formStatus');

  btn.disabled = true;
  btn.textContent = 'جارٍ النشر...';
  status.textContent = 'يرجى الانتظار';

  try {
    const files = Array.from($('photos').files);

    if (files.length > 5) throw new Error('اختر 5 صور كحد أقصى.');

    for (const f of files) {
      if (f.size > 5 * 1024 * 1024)
        throw new Error('حجم الصورة أكبر من 5 ميجابايت.');
    }

    const urls = [];
    for (const f of files) urls.push(await uploadPhoto(f));

    const feeText = $('fee').value.trim();
    const feeNumber = feeText.match(/\d+(?:\.\d+)?/);
    const discountText = $('discount').value.trim();
    const discountNumber = discountText.match(/\d+(?:\.\d+)?/);

    const record = {
      title:$('title').value.trim(),
      governorate:'أسيوط',
      city:$('city').value.trim(),
      area:$('city').value.trim(),
      property_type:$('unitType').value,
      area_m2:$('unitArea').value ? Number($('unitArea').value) : null,
      total_price:$('asking').value ? Number($('asking').value) : null,
      paid_amount:Number($('paid').value),
      remaining_amount:Number($('remaining').value),
      assignment_fee:feeNumber ? Number(feeNumber[0]) : null,
      assignment_fee_percentage:null,
      discount_amount:discountNumber ? Number(discountNumber[0]) : null,
      description:$('notes').value.trim(),
      image_urls:urls,
      developer_name:$('company').value.trim() || null,
      contact_name:$('contactName').value.trim() || null,
      contact_phone:$('phone').value.trim(),
      status:'available'
    };

    const r = await fetch(
      `${SUPABASE_URL}/rest/v1/property_offers`,
      {
        method:'POST',
        headers:{
          apikey:SUPABASE_KEY,
          Authorization:`Bearer ${SUPABASE_KEY}`,
          'Content-Type':'application/json',
          Prefer:'return=representation'
        },
        body:JSON.stringify(record)
      }
    );

    if (!r.ok) throw new Error('لم يتم حفظ العرض: ' + await r.text());

    alert('تم نشر العرض بنجاح.');
    $('newOffer').reset();
    $('preview').innerHTML = '';
    await loadOffers();
    $('offers').scrollIntoView({behavior:'smooth'});
    status.textContent = '';

  } catch (err) {
    alert(err.message || 'حدث خطأ أثناء نشر العرض.');
    status.textContent = 'لم يتم النشر؛ راجع الإعدادات أو حاول مرة أخرى.';
    console.error(err);

  } finally {
    btn.disabled = false;
    btn.textContent = 'نشر العرض';
  }
});

loadOffers();
</script>
</body>
</html>
